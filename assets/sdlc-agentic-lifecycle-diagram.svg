<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Title Header -->
  <text x="600" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1">THE AGENTIC SOFTWARE DEVELOPMENT LIFE CYCLE (SDLC)</text>
  <text x="600" y="102" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Transformasi dari Asisten Kode Lokal Menuju Orkestrasi Multi-Agen Lintas Repositori</text>

  <!-- Flow Pathway Line -->
  <path d="M 160 300 H 1040" stroke="url(#cyanGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Stage 1 -->
  <g transform="translate(100, 210)">
    <rect width="180" height="180" rx="16" fill="url(#nodeGrad1)" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="rgba(0,240,255,0.15)"/>
    <text x="90" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#00f0ff" text-anchor="middle">1</text>
    <text x="90" y="100" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Spec &amp; PRD</text>
    <text x="90" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dekomposisi Tiket</text>
    <text x="90" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Requirements Agent</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(330, 210)">
    <rect width="180" height="180" rx="16" fill="url(#nodeGrad1)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="rgba(56,189,248,0.15)"/>
    <text x="90" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle">2</text>
    <text x="90" y="100" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Architecture</text>
    <text x="90" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Perancangan Modul</text>
    <text x="90" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Planning Agent</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(560, 210)">
    <rect width="180" height="180" rx="16" fill="url(#nodeGrad1)" stroke="#818cf8" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="rgba(129,140,248,0.15)"/>
    <text x="90" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">3</text>
    <text x="90" y="100" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">SWE Coding</text>
    <text x="90" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Eksekusi Multi-Berkas</text>
    <text x="90" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">SWE Coding Agent</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(790, 210)">
    <rect width="180" height="180" rx="16" fill="url(#nodeGrad1)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="rgba(168,85,247,0.15)"/>
    <text x="90" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#a855f7" text-anchor="middle">4</text>
    <text x="90" y="100" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Test &amp; Verify</text>
    <text x="90" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Uji SWE-bench &amp; E2E</text>
    <text x="90" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#a855f7" text-anchor="middle">Testing Sentinel Agent</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(1020, 210)">
    <rect width="160" height="180" rx="16" fill="url(#nodeGrad1)" stroke="#10b981" stroke-width="2"/>
    <circle cx="80" cy="45" r="24" fill="rgba(16,185,129,0.15)"/>
    <text x="80" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#10b981" text-anchor="middle">5</text>
    <text x="80" y="100" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">PR &amp; Deploy</text>
    <text x="80" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Review &amp; Release</text>
    <text x="80" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Human Approver (HITL)</text>
  </g>

  <!-- Bottom Insight Badge -->
  <rect x="250" y="470" width="700" height="80" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="600" y="505" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">PROYEKSI GARTNER 2028: PENINGKATAN PRODUKTIVITAS SDLC SEBESAR 25% – 50%</text>
  <text x="600" y="530" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Peran insinyur perangkat lunak berevolusi dari penulisan sintaksis manual menuju kurasi arsitektur dan supervisi kualitas sistemik.</text>
</svg>
