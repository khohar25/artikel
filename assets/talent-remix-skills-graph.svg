<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="talentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="50%" stop-color="#101930"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2845"/>
      <stop offset="100%" stop-color="#101b30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#talentBg)"/>

  <!-- Title Header -->
  <text x="600" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PARADIGMA TALENT REMIX &amp; SKILLS INTELLIGENCE</text>
  <text x="600" y="102" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Pergeseran dari Deskripsi Pekerjaan Statis Menuju Pemetaan Keahlian Dinamis Berbasis AI</text>

  <!-- Left: Traditional Job-Based (Legacy) -->
  <g transform="translate(100, 160)">
    <rect width="450" height="340" rx="16" fill="url(#boxGrad)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="2"/>
    <rect x="24" y="24" width="160" height="30" rx="6" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="104" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">MODEL TRADISIONAL</text>
    <text x="24" y="90" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Job Description Statis</text>
    
    <text x="24" y="130" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Karyawan terpaku pada kotak jabatan kaku</text>
    <text x="24" y="165" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Solusi disrupsi berupa PHK (*Layoffs*) massal</text>
    <text x="24" y="200" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Silo antar departemen menghambat mobilitas</text>
    <text x="24" y="235" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Siklus rekrutmen ulang mahal &amp; memakan waktu</text>
    
    <rect x="24" y="275" width="402" height="40" rx="8" fill="rgba(239, 68, 68, 0.1)"/>
    <text x="225" y="300" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="middle">Kerapuhan Organisasi: Tingginya Turnover &amp; Biaya</text>
  </g>

  <!-- Right: Modern AI Talent Remix -->
  <g transform="translate(650, 160)">
    <rect width="450" height="340" rx="16" fill="url(#boxGrad)" stroke="rgba(45, 212, 191, 0.5)" stroke-width="2"/>
    <rect x="24" y="24" width="180" height="30" rx="6" fill="rgba(45, 212, 191, 0.15)"/>
    <text x="114" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle">ERA AGENTIC HR (2026)</text>
    <text x="24" y="90" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Dynamic Talent Remix</text>
    
    <text x="24" y="130" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Pemetaan keahlian mikro (*micro-skills graph*)</text>
    <text x="24" y="165" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Rekonfigurasi peran internal alih-alih pemutusan kerja</text>
    <text x="24" y="200" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Pasar talenta internal (*Internal Talent Marketplace*)</text>
    <text x="24" y="235" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">• Pembelajaran adaptif terarah (Targeted Reskilling)</text>
    
    <rect x="24" y="275" width="402" height="40" rx="8" fill="rgba(45, 212, 191, 0.1)"/>
    <text x="225" y="300" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#5eead4" text-anchor="middle">Strategi Gartner 2026: Workforce Amplification</text>
  </g>

  <!-- Bottom Quote -->
  <text x="600" y="560" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Manajemen talenta modern menggunakan AI untuk meredistribusi kapasitas insani ke peluang nilai baru perusahaan.</text>
</svg>
