<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#121e3a"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0f1a30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#shieldBg)"/>

  <!-- Title Header -->
  <text x="600" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">FRAMEWORK KEPATUHAN UU PDP &amp; AUDIT BIAS AI HR</text>
  <text x="600" y="102" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Prinsip Pelindungan Data Pribadi Pelamar dan Mitigasi Diskriminasi Algoritmik di Indonesia</text>

  <!-- 3 Pillars Grid -->
  <!-- Pillar 1: Hak Subjek Data -->
  <g transform="translate(100, 160)">
    <rect width="300" height="340" rx="16" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="50" r="26" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="150" y="58" font-family="'Inter', sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="150" y="110" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Hak Subjek Data</text>
    <text x="150" y="135" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Pasal 16 &amp; 20 UU PDP</text>
    
    <text x="24" y="180" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Persetujuan eksplisit CV</text>
    <text x="24" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Hak menolak profiling AI</text>
    <text x="24" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Hak atas keterbukaan data</text>
    <text x="24" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Penghapusan riwayat pelamar</text>
  </g>

  <!-- Pillar 2: Explainability & Audit Bias -->
  <g transform="translate(450, 160)">
    <rect width="300" height="340" rx="16" fill="url(#cardGrad2)" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="150" cy="50" r="26" fill="rgba(45, 212, 191, 0.15)"/>
    <text x="150" y="58" font-family="'Inter', sans-serif" font-size="20" fill="#2dd4bf" text-anchor="middle">2</text>
    <text x="150" y="110" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Explainability AI</text>
    <text x="150" y="135" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle">Anti-Black Box Screening</text>
    
    <text x="24" y="180" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Alasan logis eliminasi CV</text>
    <text x="24" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Audit bias data historis</text>
    <text x="24" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Netralitas gender &amp; kampus</text>
    <text x="24" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Uji tuntas berkala model</text>
  </g>

  <!-- Pillar 3: Human-in-the-Loop Gate -->
  <g transform="translate(800, 160)">
    <rect width="300" height="340" rx="16" fill="url(#cardGrad2)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="150" cy="50" r="26" fill="rgba(251, 191, 36, 0.15)"/>
    <text x="150" y="58" font-family="'Inter', sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle">3</text>
    <text x="150" y="110" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Human Oversight</text>
    <text x="150" y="135" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">SE Kominfo No. 9/2023</text>
    
    <text x="24" y="180" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Larangan pemutus tunggal AI</text>
    <text x="24" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Validasi wawancara tatap muka</text>
    <text x="24" y="250" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Keputusan final oleh Recruiter</text>
    <text x="24" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">• Perlindungan martabat manusia</text>
  </g>

  <!-- Bottom Notice -->
  <text x="600" y="560" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Penyelenggara rekrutmen AI di Indonesia wajib mematuhi UU PDP No. 27/2022 guna menghindari sanksi denda 2% pendapatan.</text>
</svg>
